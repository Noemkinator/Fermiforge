[package]
name = "fermiforge-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Physics core for Fermiforge: provenance-tracked values, scene state and URL codec."
repository = "https://github.com/Noemkinator/Fermiforge"
readme = "../README.md"
keywords = ["physics", "provenance", "wasm"]
categories = ["science"]

[dependencies]
base64 = "0.22"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
miniz_oxide = "0.8"
proptest = "1"
serde_json = "1"
