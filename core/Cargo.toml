[package]
name = "fermiforge-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Physics core for Fermiforge: provenance-tracked values, scene state and URL codec."
repository = "https://github.com/Noemkinator/Fermiforge"
readme = "../README.md"
keywords = ["physics", "provenance", "wasm"]
categories = ["science"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
base64 = "0.22"
miniz_oxide = "0.8"
serde_json = "1"

# property tests (group C) run natively only; proptest otherwise drags
# getrandom into the wasm32 dev build
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
